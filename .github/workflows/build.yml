name: Rebuild data.js + convert HEIC

on:
  push:
    branches: [main]
    paths:
      - 'Images/**'
      - 'generate.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HEIC tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libheif-examples >/dev/null || true
          python3 -m pip install --quiet pillow-heif Pillow

      - name: Run generate.sh
        run: |
          chmod +x generate.sh
          ./generate.sh

      - name: Commit converted JPGs and updated data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js "Images/**/*.jpg" "Images/**/*.jpeg" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: rebuild data.js + convert HEIC"
            git push
          else
            echo "Nothing to commit"
          fi
